name: HarmoniaLintAndTest

on: [push]

env:
  PHP_VERSION: "8.4"
  KERNEL_CLASS: ${{secrets.KERNEL_CLASS}}
  }
   
jobs:
  HarmoniaLintAndTest:
    name: LintAndTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{env.PHP_VERSION}}
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: create .env
        run: |
          touch .env
          echo APP_SECRET=${{secrets.APP_SECRET}} >> .env
          echo DATABASE_URL=${{secrets.DATABASE_URL}} >> .env
          echo DEFAULT_URI=${{secrets.DEFAULT_URI}} >> .env

      - name: composer install
        run: composer install

      - name: Lint YAML files
        run: php bin/console lint:yaml config

      - name: Lint Twig templates
        run: php bin/console lint:twig templates

      - name: php-cs-fixer
        run: vendor/bin/php-cs-fixer fix

      - name: phpstan
        run: vendor/bin/phpstan analyse 

      - name: verifier la version du phpUnit
        run: php bin/phpunit --version

      - name: test home titre
        run: php bin/phpunit tests/Controller/HomeControllerTest.php