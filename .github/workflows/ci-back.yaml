name: HarmoniaLintAndTest

on: [push]

env:
  PHP_VERSION: "8.4"
   
jobs:
  HarmoniaLintAndTest:
    name: LintAndTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{env.PHP_VERSION}}
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: create .env
        run: |
          touch .env
          echo KERNEL_CLASS=${{secrets.KERNEL_CLASS}} >> .env
          echo APP_SECRET=${{secrets.APP_SECRET}} >> .env
          echo DATABASE_URL=${{secrets.DATABASE_URL}} >> .env
          echo DEFAULT_URI=${{secrets.DEFAULT_URI}} >> .env

      - name: composer install
        run: composer install

      - name: php-cs-fixer
        run: composer require --dev friendsofphp/php-cs-fixer &&
             vendor/bin/php-cs-fixer init &&
             vendor/bin/php-cs-fixer check

      - name: phpstan
        run: vendor/bin/phpstan analyse --level=9 --no-progress

      - name: Lint YAML files
        if: always() && steps.install.outcome == 'success'
        run: ./bin/console lint:yaml config --parse-tags

      - name: Lint Twig templates
        if: always() && steps.install.outcome == 'success'
        run: ./bin/console lint:twig templates 
